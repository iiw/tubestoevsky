[project]
name = "transcript-app"
version = "0.1.0"
description = "YouTube transcript downloader + LangChain/LiteLLM prose pipeline"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.7.4",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "litellm>=1.60",
    "python-dotenv>=1.0",
    "langchain-litellm>=0.10.0",
    "curl-cffi>=0.16.3",
    "openai>=2.54.0",
    "requests>=2.34.2",
]

[tool.uv]
package = false
