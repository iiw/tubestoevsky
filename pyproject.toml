[project]
name = "tubestoevsky"
version = "1.0.0"
description = "Turn YouTube transcripts into literary prose with an LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Viktor Buzanov", email = "viktor.buzanov@mailbox.org" }]
keywords = ["youtube", "transcript", "subtitles", "llm", "langchain", "prose", "yt-dlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp[default]>=2026.7.4",
    "langchain-core>=0.3",
    "langchain-openai>=1.6.6",
    "python-dotenv>=1.0",
    "curl-cffi>=0.16.3",
]

[project.urls]
Homepage = "https://github.com/iiw/tubestoevsky"
Repository = "https://github.com/iiw/tubestoevsky"
Issues = "https://github.com/iiw/tubestoevsky/issues"

[project.scripts]
tubestoevsky = "transcript_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcript_app"]
