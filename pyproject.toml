[project]
name = "transcript-app"
version = "0.1.0"
description = "YouTube transcript downloader + LangChain prose pipeline over an OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.7.4",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "curl-cffi>=0.16.3",
    "openai>=2.54.0",
    "requests>=2.34.2",
    "langchain-openai>=1.6.6",
]

[tool.uv]
package = false
